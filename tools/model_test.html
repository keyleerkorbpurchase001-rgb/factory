<!doctype html><html><head><meta charset="utf-8"><title>Machine model test</title>
<style>html,body{margin:0;height:100%;background:#dfe3e6;font:13px "IBM Plex Sans",system-ui,sans-serif}#c{display:block}#hud{position:fixed;left:10px;top:10px;background:rgba(20,24,28,.85);color:#eee;padding:8px 12px;border-radius:8px;white-space:pre;font:12px ui-monospace,monospace}</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="../fl-models.js"></script>
<script src="../machines/common.js"></script>
<script src="../machines/handling.js"></script><script src="../machines/logistics.js"></script><script src="../machines/metal.js"></script><script src="../machines/lab.js"></script><script src="../machines/dress.js"></script><script src="../machines/extra.js"></script><script src="../machines/robots.js"></script><script src="../machines/takeout.js"></script>
</head><body><canvas id="c"></canvas><div id="hud"></div>
<script>
// Single-machine test bench for the portal's builders:
//   model_test.html?kind=laserCell&src=mb|fl|plant&w=3&d=2&h=2.2&name=Trumpf+TruLaser+Cell+8030&station=3D+laser+trimming
//     &lot=123&year=2016&weight=9000+kg&power=45+kW&count=2&photo=&view=iso|front|side|back|top&dress=1&run=1&opts={"type":"belt"}
// src=mb builds window.MB.kinds[kind](K,s); src=fl builds FL.builders[kind](K,s); src=plant builds FL.createPlantModels(THREE).machine(kind,s,run).
// dress=1 applies MB.dress(kind,group,s,K) (machines/dress.js) after an fl/plant build. window.READY is set once rendered;
// window.setView(name) moves the camera; window.INFO holds the bounding box.
const q=new URLSearchParams(location.search),g=(k,d)=>q.has(k)?q.get(k):d;
const canvas=document.getElementById('c'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xdfe3e6);const camera=new THREE.PerspectiveCamera(38,1,.05,200);const controls=new THREE.OrbitControls(camera,canvas);
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f93,.8));const sun=new THREE.DirectionalLight(0xffffff,1.1);sun.position.set(6,10,7);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,near:1,far:40});scene.add(sun);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0xb4b8ba,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(60,60,0x9aa0a4,0xc5c9cb);grid.position.y=.002;scene.add(grid);
const s={x:0,z:0,w:+g('w',2),d:+g('d',1.2),h:+g('h',1.8),type:g('station','Station'),name:g('name','Maker Model 100'),lot:g('lot','1001'),year:g('year','2015'),status:'in',count:+g('count',1),photo:g('photo',''),info:{weight:g('weight','1,200 kg'),power:g('power','3 × 400 V, 12 kW'),size:'',supplied:'',category:g('station','Station'),area:'',status:'In sale'},opts:JSON.parse(g('opts','{}'))};
const words=s.name.split(' ');s.make=words[0];s.model=words.slice(1).join(' ');
const K=FL.createKit(THREE);const kind=g('kind','cabinet'),src=g('src','mb');let u=null,err='';
try{if(src==='mb')u=MB.build(kind,K,s);else if(src==='fl')u=FL.builders[kind](K,s);else{u=FL.createPlantModels(THREE).machine(kind,s,g('run','1')==='1');}
 if(u&&u.group&&g('dress','0')==='1'&&window.MB&&MB.dress)MB.dress(kind,u.group,s,K)}catch(e){err=String(e.stack||e);console.error(e)}
if(u&&u.group){scene.add(u.group);u.group.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}})}
const bb=new THREE.Box3();if(u&&u.group)bb.setFromObject(u.group);const sz=bb.isEmpty()?new THREE.Vector3(1,1,1):bb.getSize(new THREE.Vector3()),ce=bb.isEmpty()?new THREE.Vector3():bb.getCenter(new THREE.Vector3());
window.INFO={kind,src,size:[sz.x,sz.y,sz.z].map(v=>+v.toFixed(2)),min:bb.min.toArray().map(v=>+v.toFixed(2)),err};
const R=Math.max(sz.x,sz.y,sz.z);
window.setView=function(v){const d=R*1.25+1.2;const p={iso:[ce.x+d*.8,ce.y+d*.6,ce.z+d*.9],front:[ce.x,ce.y+d*.25,ce.z+d*1.3],side:[ce.x+d*1.3,ce.y+d*.25,ce.z],back:[ce.x-d*.6,ce.y+d*.5,ce.z-d*1.1],top:[ce.x+.01,ce.y+d*1.6,ce.z+.01],close:[ce.x+d*.35,ce.y+d*.3,ce.z+d*.45]}[v]||[ce.x+d*.8,ce.y+d*.6,ce.z+d*.9];
 camera.position.set(...p);controls.target.copy(ce);controls.update();render()};
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()}addEventListener('resize',()=>{resize();render()});
const clock=new THREE.Clock();let t=0;function render(){renderer.render(scene,camera)}
function loop(){const dt=Math.min(.05,clock.getDelta());t+=dt;if(u&&typeof u.update==='function'){try{u.update(t,g('run','1')==='1',t)}catch(e){}}controls.update();render();requestAnimationFrame(loop)}
resize();setView(g('view','iso'));loop();document.getElementById('hud').textContent=`${src}:${kind}  ${sz.x.toFixed(2)} × ${sz.y.toFixed(2)} × ${sz.z.toFixed(2)} m  (w ${s.w} d ${s.d} h ${s.h})\n${s.type} · ${s.name}${err?'\n'+err.slice(0,300):''}`;
setTimeout(()=>{window.READY=true},600);
</script></body></html>
